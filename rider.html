<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Lakbay rider app — manage availability, receive ride requests, navigate trips, and track earnings." />
  <title>Lakbay — Rider</title>
  <meta name="theme-color" content="#F4F6EF" />
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lakbay" />
  <!-- Self-hosted typography — Sora + Manrope (no third-party CDN) -->
  <link rel="preload" href="assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Theme before first paint (see js/shared/theme.js) -->
  <script>try{var t=localStorage.getItem('lakbay:theme')||'system';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/rider.css" />
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/lucide.min.js"></script>
</head>
<body>
  <!-- The app shell (sidebar, header, bottom nav, view root) is built by js/app.js -->
  <!-- Offline service worker in production only; on localhost it would serve cached files while you edit, so remove any old one -->
  <script>if ('serviceWorker' in navigator) { var dev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname); window.addEventListener('load', function () { if (dev) { navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); } else { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {}); } }); }</script>
  <script type="module" src="js/rider/main.js"></script>
</body>
</html>
