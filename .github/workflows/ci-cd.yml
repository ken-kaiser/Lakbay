name: CI

# Checks every push and pull request. Deployment is handled by GitHub Pages
# itself (Settings → Pages → "Deploy from a branch": main / root), which
# publishes https://ken-kaiser.github.io/Lakbay/ automatically after each push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, service worker and link checks
        run: node .github/scripts/check.mjs
